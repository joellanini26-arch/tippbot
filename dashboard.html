<body>
<header>
  <div class="top">
    <div class="logo">⚽</div>
    <div class="brand"><h1>Tippbot</h1><div class="sub" id="stand"></div></div>
    <select id="lg" aria-label="Liga"></select>
  </div>
  <nav id="tabs"></nav>
</header>
<main><div id="view"></div><footer id="duo" class="duo"></footer></main>
<script>
const D = __DATA__;
const LOADED = Date.now();
const ICON = {
  tips: '<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/><path d="m12 7 3.5 2.5-1.3 4h-4.4l-1.3-4Z"/><path d="M12 3v4M15.5 9.5 20 8M14.2 13.5l2.3 4.5M9.8 13.5 7.5 18M8.5 9.5 4 8"/>',
  duell: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/><path d="M9.5 6.5 14 2h3v3l-4.5 4.5"/><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"/>',
  multi: '<path d="M4 18 10 12l4 4 6-8"/><path d="M15 8h5v5"/>',
  konto: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/>',
  wetten: '<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  tabelle: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  modell: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
const TABS = [["tips","Tipps"],["duell","Duell"],["multi","Multi"],["konto","Konto"],["wetten","Wetten"],["tabelle","Tabelle"],["modell","Modell"]];
const KIND = {"1X2":"Tipp","SCORE":"Resultat","OU":"Over/Under","BOTD":"Bet of the day"};
const PICKS = {"1":"Heimsieg","2":"Auswärtssieg","X":"Unentschieden","1X":"Heimsieg oder Unentschieden","X2":"Auswärtssieg oder Unentschieden"};
const pickLabel = p => p.startsWith("Over") ? "Über " + p.split(" ")[1] + " Tore" : p.startsWith("Under") ? "Unter " + p.split(" ")[1] + " Tore" : (PICKS[p] || p);
const STATUS = {OPEN:"offen",WON:"gewonnen",LOST:"verloren",VOID:"storniert",CANCELLED:"verfallen"};
const BADGE = {OPEN:"open",WON:"won",LOST:"lost"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt = iso => iso.endsWith("T00:00:00Z")
  ? new Date(iso).toLocaleDateString("de-CH",{timeZone:"UTC",weekday:"short",day:"2-digit",month:"2-digit"})
  : new Date(iso).toLocaleString("de-CH",{timeZone:"Europe/Zurich",weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const pct = v => v == null ? "–" : Math.round(v*100) + "%";
const chf = v => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
const fr = v => Number(v).toLocaleString("de-CH", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const day = iso => new Date(iso).toLocaleDateString("de-CH", {timeZone: "Europe/Zurich", day: "2-digit", month: "2-digit", year: "2-digit"});
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const lname = c => c === "MIX" ? "Kombi" : (D.leagues[c] || c);
const badge = s => `<span class="badge ${BADGE[s] || ""}">${STATUS[s] || s}</span>`;
let store = {}; try { store = window.localStorage; } catch (e) {}
const get = (k, d) => { try { return store.getItem(k) || d; } catch (e) { return d; } };
const set = (k, v) => { try { store.setItem(k, v); } catch (e) {} };
let state = {view: get("view", "all"), league: get("league","ALL"), tab: (location.hash || "").slice(1) || "tips", kind: "ALL", only: get("only","0") === "1"};
if (state.league !== "ALL" && !D.leagues[state.league]) state.league = "ALL";
if (!TABS.some(t => t[0] === state.tab)) state.tab = "tips";
const inLeague = r => state.league === "ALL" || r.league === state.league;
const oneLeague = () => state.league !== "ALL" ? state.league : Object.keys(D.leagues)[0];
const m = (l, v, c) => `<div class="metric"><span>${l}</span><b class="${c || ""}">${v}</b></div>`;
const LEGMARK = {WON: "✅", LOST: "❌", VOID: "↩️", OPEN: "⏳"};
const legList = legs => `<div class="legs">` + legs.map(l => {
  const ev = l.state === "OPEN" ? liveOf(l.league, l.utc, l.home, l.away) : null;
  const ok = ev ? liveCheck(l.pick, ev) : null;
  const ic = ok === true ? "🟢" : ok === false ? "🔴" : LEGMARK[l.state];
  return `<div class="leg"><span class="ic">${ic}</span><div>${pair(l.home, l.away, 16)}: <b>${esc(pickLabel(l.pick))}</b> ${liveTag(ev)}<br><small>${l.utc ? dt(l.utc) + " · " : ""}@${l.odds.toFixed(2)}${l.prob != null ? " · " + pct(l.prob) : ""}${l.hg != null ? " · Endstand " + l.hg + ":" + l.ag : ""}</small></div></div>`;
}).join("") + "</div>";
const comboLive = (legs, stake, odds, open) => {
  if (!open) return "";
  const st = legs.map(l => l.state === "OPEN" ? (() => { const ev = liveOf(l.league, l.utc, l.home, l.away); return ev ? liveCheck(l.pick, ev) : null; })() : l.state === "LOST" ? false : true);
  if (!legs.some(l => l.state === "OPEN" && liveOf(l.league, l.utc, l.home, l.away)) && !st.includes(false)) return `<div class="livebox"><small>Auszahlung bei Treffer</small><b class="num">${fr(stake * odds)} CHF</b></div>`;
  const tag = st.includes(false) ? stateTag(false) : st.every(x => x === true) ? stateTag(true) : '<span class="badge open">⏳ läuft, noch offen</span>';
  return `<div class="livebox">${tag}<span class="num"><small>bei Treffer</small> <b>${fr(stake * odds)} CHF</b></span></div>`;
};

// ---------- Wappen ----------
const initials = n => String(n).replace(/[^A-Za-zÀ-ÿ0-9 ]/g, "").split(" ").filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
function crest(name, size) {
  const url = (D.crests || {})[name];
  const flag = url && url.includes("flagcdn");
  return `<span class="cr${url ? " has" : ""}${flag ? " flag" : ""}" style="--s:${size || 20}px"><b>${esc(initials(name))}</b>${url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has','flag');this.remove()">` : ""}</span>`;
}
const team = (name, size) => `<span class="tm">${crest(name, size)}<span>${esc(name)}</span></span>`;
const pair = (h, a, size) => `${team(h, size)} – ${team(a, size)}`;

// ---------- Live-Resultate (ESPN, im Browser) ----------
const ESPN_SLUG = {PL: "eng.1", PD: "esp.1", BL1: "ger.1", SA: "ita.1", FL1: "fra.1", NL: "uefa.nations",
  ELC: "eng.2", DED: "ned.1", PPL: "por.1"};
const LIVE = {events: {}, ok: null, at: null};
const STOP = new Set(["fc","afc","cf","sc","ac","as","ss","ssc","us","sv","vfb","vfl","tsg","rc","ogc","club","de","cd","ud","sd","rcd","the","calcio","and","1","04","05","07","1907","1899","1909"]);
const toks = n => new Set(String((D.espn_names || {})[n] || n).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").split(" ").filter(w => w && !STOP.has(w)));
function nameSim(a, b) {
  const A = toks(a), B = toks(b);
  if (!A.size || !B.size) return 0;
  let common = 0; A.forEach(w => { if (B.has(w)) common++; });
  if (!common) { const ja = [...A].join(""), jb = [...B].join(""); return ja.includes(jb) || jb.includes(ja) ? 0.8 : 0; }
  return common / Math.min(A.size, B.size);
}
const CODE_BY_NAME = Object.fromEntries(Object.entries(D.leagues).map(([c, n]) => [n, c]));
function liveOf(league, utc, home, away) {
  const code = ESPN_SLUG[league] ? league : CODE_BY_NAME[league];
  const evs = LIVE.events[code];
  if (!evs || !utc) return null;
  const t = Date.parse(utc);
  let best = null, bs = 0;
  for (const e of evs) {
    if (Math.abs(e.t - t) > 3 * 3600e3) continue;
    const sc = nameSim(home, e.home) + nameSim(away, e.away);
    if (sc > bs) { bs = sc; best = e; }
  }
  return bs >= 1 && best && best.state !== "pre" ? best : null;
}
function liveCheck(pick, ev) {         // geht die Wette beim aktuellen Spielstand auf?
  const h = ev.hg, a = ev.ag;
  if (h == null || a == null) return null;
  const res = h > a ? "1" : h === a ? "X" : "2";
  let m;
  if (/^(1|X|2|1X|X2|12)$/.test(pick)) return pick.includes(res);
  if ((m = pick.match(/^(?:Over |O)(\d+(?:\.\d+)?)$/))) return h + a > +m[1];
  if ((m = pick.match(/^(?:Under |U)(\d+(?:\.\d+)?)$/))) return h + a < +m[1];
  if (pick === "BTTS_YES") return h > 0 && a > 0;
  if (pick === "BTTS_NO") return !(h > 0 && a > 0);
  if ((m = pick.match(/^(?:CS_)?(\d+)[:\-](\d+)$/))) return h === +m[1] && a === +m[2];
  return null;
}
const liveTag = ev => !ev ? "" : ev.state === "in"
  ? `<span class="live">${esc(ev.clock)} · ${ev.hg}:${ev.ag}</span>`
  : `<span class="live end">${esc(ev.detail || "Ende")} · ${ev.hg}:${ev.ag}</span>`;
const livePill = ev => !ev ? "" : ev.state === "in" ? `<span class="livepill">LIVE ${esc(ev.clock)}</span>` : `<span class="livepill end">${esc(ev.detail || "Ende")}</span>`;
const gattr = (league, utc, home, away) => `data-g="${esc([league, utc, home, away].join("|"))}"`;
const LAST_SCORE = {};                 // fuer die Tor-Animation
function bigScore(ev, key) {
  const sc = ev.hg + ":" + ev.ag, flash = LAST_SCORE[key] && LAST_SCORE[key] !== sc && ev.state === "in";
  LAST_SCORE[key] = sc;
  return `<span class="bigscore${ev.state === "in" ? "" : " end"}${flash ? " flash" : ""}">${ev.hg}:${ev.ag}</span>`;
}
const stateTag = (ok, fin) => ok === true ? `<span class="badge won">✅ ${fin ? "aufgegangen" : "geht auf"}</span>`
  : ok === false ? `<span class="badge lost">❌ ${fin ? "nicht aufgegangen" : "geht nicht auf"}</span>` : "";

function openLegs() {                  // alle offenen Spiele, fuer die Live-Daten gebraucht werden
  const out = [];
  D.bets.forEach(b => { if (b.status === "OPEN") (b.legs || [b]).forEach(l => out.push([l.league, l.utc])); });
  if (D.botd) D.botd.legs.forEach(l => out.push([l.league, l.utc]));
  (D.multi && D.multi.runs || []).forEach(r => r.bets.forEach(b => b.status === "OPEN" && b.legs.forEach(l => out.push([l.league, l.utc]))));
  (D.duel && D.duel.attempts || []).forEach(a => a.bets.forEach(b => b.status === "open" && b.legs.forEach(l => out.push([CODE_BY_NAME[l.competition], l.kickoff]))));
  const now = Date.now();
  return out.filter(([c, u]) => c && u && ESPN_SLUG[c] && !u.endsWith("T00:00:00Z") && Date.parse(u) < now + 10 * 60e3 && Date.parse(u) > now - 18 * 3600e3);
}
async function loadLive() {
  const want = {};
  openLegs().forEach(([c, u]) => { (want[c] = want[c] || new Set()).add(u.slice(0, 10).replace(/-/g, "")); });
  const jobs = [];
  for (const [c, days] of Object.entries(want)) for (const d of days) jobs.push([c, d]);
  if (!jobs.length) return false;
  const events = {};
  let ok = 0;
  await Promise.all(jobs.map(async ([c, d]) => {
    try {
      const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${ESPN_SLUG[c]}/scoreboard?dates=${d}`, {cache: "no-store"});
      if (!r.ok) return;
      const j = await r.json(); ok++;
      (j.events || []).forEach(ev => {
        const comp = (ev.competitions || [])[0]; if (!comp) return;
        const t = {}; (comp.competitors || []).forEach(x => t[x.homeAway] = x);
        if (!t.home || !t.away) return;
        const st = (ev.status || {}).type || {};
        const num = v => v === undefined || v === null || v === "" ? null : Math.round(+v);
        (events[c] = events[c] || []).push({id: ev.id, code: c, t: Date.parse(ev.date), home: t.home.team.displayName, away: t.away.team.displayName,
          hg: num(t.home.score), ag: num(t.away.score), state: st.state || "pre",
          clock: st.shortDetail || (ev.status || {}).displayClock || "", detail: st.shortDetail || ""});
      });
    } catch (e) {}
  }));
  LIVE.events = events; LIVE.ok = ok > 0; LIVE.at = Date.now();
  return true;
}
async function refreshLive() {
  if (document.visibilityState === "hidden") return;
  const had = await loadLive();
  if (had && ["wetten", "tips", "multi", "duell"].includes(state.tab)) {
    const y = window.scrollY; $("#view").innerHTML = VIEWS[state.tab](); window.scrollTo(0, y);
  }
}

// ---------- Statistik-Fenster (ESPN, im Browser) ----------
const SB_CACHE = {};                   // Scoreboards pro Liga und Tag
async function scoreboard(code, day) {
  const k = code + day;
  if (!SB_CACHE[k]) SB_CACHE[k] = fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${ESPN_SLUG[code]}/scoreboard?dates=${day}`, {cache: "no-store"})
    .then(r => r.ok ? r.json() : {events: []}).then(j => (j.events || []).map(ev => {
      const comp = (ev.competitions || [])[0] || {}, t = {}; (comp.competitors || []).forEach(x => t[x.homeAway] = x);
      return t.home && t.away ? {id: ev.id, t: Date.parse(ev.date), home: t.home.team.displayName, away: t.away.team.displayName} : null;
    }).filter(Boolean)).catch(() => { delete SB_CACHE[k]; return []; });
  return SB_CACHE[k];
}
async function findEvent(league, utc, home, away) {
  const code = ESPN_SLUG[league] ? league : CODE_BY_NAME[league];
  if (!code || !ESPN_SLUG[code] || !utc) return null;
  const t = Date.parse(utc);
  const days = new Set([utc.slice(0, 10), new Date(t - 864e5).toISOString().slice(0, 10)].map(d => d.replace(/-/g, "")));
  let best = null, bs = 0;
  for (const d of days) for (const e of await scoreboard(code, d)) {
    if (Math.abs(e.t - t) > 3 * 3600e3) continue;
    const sc = nameSim(home, e.home) + nameSim(away, e.away);
    if (sc > bs) { bs = sc; best = e; }
  }
  return bs >= 1 ? {code, id: best.id} : null;
}
const STATS = [["possessionPct", "Ballbesitz", "%"], ["totalShots", "Schüsse"], ["shotsOnTarget", "Schüsse aufs Tor"],
  ["wonCorners", "Ecken"], ["saves", "Paraden"], ["foulsCommitted", "Fouls"], ["offsides", "Abseits"],
  ["yellowCards", "Gelbe Karten"], ["redCards", "Rote Karten"]];
function closeSheet() { const s = $("#sheet"); if (s) s.remove(); document.body.style.overflow = ""; }
async function openGame(league, utc, home, away) {
  closeSheet();
  const bg = document.createElement("div"); bg.id = "sheet"; bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="Statistik"><div class="grab"></div><button class="x" aria-label="Schliessen">✕</button><div id="sheet-body"></div></div>`;
  document.body.appendChild(bg); document.body.style.overflow = "hidden";
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest(".x")) closeSheet(); });
  const body = $("#sheet-body");
  const head = (score, pill) => `<div class="meta" style="margin-top:6px"><span class="lg"><i class="dot"></i>${esc(lname(CODE_BY_NAME[league] || league))}</span><span>${dt(utc)}</span></div>
    <div class="teams" style="margin:14px 0 8px"><span class="t" style="flex-direction:column;align-items:center;text-align:center;gap:6px">${crest(home, 44)}<span>${esc(home)}</span></span>
    ${score || '<span class="vs">VS</span>'}<span class="t" style="flex-direction:column;align-items:center;text-align:center;gap:6px">${crest(away, 44)}<span>${esc(away)}</span></span></div>
    <div style="text-align:center;min-height:24px">${pill || ""}</div>`;
  // Einschaetzung des Bots (nur fuer kommende Spiele im Datensatz)
  const up = D.upcoming.find(r => r.utc === utc && r.home === home && r.away === away);
  const model = up ? `<h2>Einschätzung des Bots</h2><div class="card">
      <div class="bar"><i class="b1" style="flex:${up.p1}"></i><i class="bx" style="flex:${up.px}"></i><i class="b2" style="flex:${up.p2}"></i></div>
      <div class="probs"><span>1 <b>${pct(up.p1)}</b></span><span>X <b>${pct(up.px)}</b></span><span>2 <b>${pct(up.p2)}</b></span></div>
      <div class="chips"><span class="chip">Erwartete Tore <b>${up.eh.toFixed(1)} : ${up.ea.toFixed(1)}</b></span><span class="chip">Wahrscheinlichstes Resultat <b>${esc(up.score)}</b></span>
      <span class="chip">Über ${D.ou_line} Tore <b>${pct(up.po)}</b></span></div></div>` : "";
  body.innerHTML = head(null, '<span class="note">Statistik wird geladen …</span>') + model;
  let ev = null, sum = null;
  try {
    ev = await findEvent(league, utc, home, away);
    if (ev) { const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${ESPN_SLUG[ev.code]}/summary?event=${ev.id}`, {cache: "no-store"}); if (r.ok) sum = await r.json(); }
  } catch (e) {}
  if (!$("#sheet-body")) return;          // inzwischen geschlossen
  if (!sum) { body.innerHTML = head(null, "") + model + `<div class="card empty">${ev === null && !up ? "Für dieses Spiel gibt es keine Statistik." : "Statistiken gibt es ab Anpfiff."}</div>`; return; }
  const comp = ((sum.header || {}).competitions || [])[0] || {};
  const cs = {}; (comp.competitors || []).forEach(x => cs[x.homeAway] = x);
  const st = ((comp.status || {}).type) || {};
  const live = {state: st.state || "pre", clock: st.shortDetail || "", detail: st.shortDetail || "",
    hg: cs.home && cs.home.score != null && cs.home.score !== "" ? +cs.home.score : null, ag: cs.away && cs.away.score != null && cs.away.score !== "" ? +cs.away.score : null};
  const score = live.state !== "pre" && live.hg != null ? bigScore(live, "sheet" + utc + home) : null;
  const homeId = cs.home && cs.home.id;
  // Mannschaftsstatistik
  const teams = ((sum.boxscore || {}).teams) || [];
  const tH = teams.find(x => (x.team || {}).id === homeId) || teams[0], tA = teams.find(x => x !== tH);
  const val = (t, n) => { const x = ((t && t.statistics) || []).find(y => y.name === n); return x ? parseFloat(x.displayValue) : null; };
  const rows = STATS.map(([n, lbl, unit]) => {
    const a = val(tH, n), b = val(tA, n);
    if (a == null || b == null || (a === 0 && b === 0 && n === "redCards")) return "";
    const tot = a + b || 1;
    return `<div class="st"><div class="lbl3"><b>${a}${unit || ""}</b><span>${lbl}</span><b>${b}${unit || ""}</b></div>
      <div class="bars"><i class="b1" style="flex:${a / tot}"></i><i class="b2" style="flex:${b / tot}"></i></div></div>`;
  }).join("");
  // Ereignisse: Tore und Karten
  const evs = (sum.keyEvents || []).map(k => {
    const typ = ((k.type || {}).text || "").toLowerCase();
    const icon = k.scoringPlay || typ.includes("goal") ? "⚽" : typ.includes("red") ? "🟥" : typ.includes("yellow") ? "🟨" : null;
    if (!icon) return "";
    const who = ((k.participants || [])[0] || {}).athlete;
    const side = ((k.team || {}).id === homeId) ? "home" : "away";
    return `<div class="ev ${side}"><span class="min">${esc((k.clock || {}).displayValue || "")}</span><span>${icon}</span><span>${esc(who ? who.displayName : (k.text || ""))}</span></div>`;
  }).join("");
  body.innerHTML = head(score, live.state !== "pre" ? livePill(live) : "") +
    (evs ? `<h2>Tore und Karten</h2><div class="card">${evs}</div>` : "") +
    (rows ? `<h2>Statistik</h2><div class="card">${rows}</div>` : live.state === "pre" ? "" : '<div class="card empty">Für dieses Spiel liefert ESPN keine Statistik.</div>') +
    model + (live.state === "pre" && !rows ? '<div class="card empty">Statistiken gibt es ab Anpfiff.</div>' : "") +
    '<div class="note">Daten von ESPN.</div>';
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function account() {
  const total = D.daily.reduce((a, r) => a + r.profit, 0);
  const open = D.open.reduce((a, r) => ({n: a.n + r.n, stake: a.stake + r.stake}), {n: 0, stake: 0});
  return {bal: D.start_balance + total, total, open};
}

function botdCard() {
  const b = D.botd;
  if (!b || !inLeague(b)) return "";
  const res = b.status === "OPEN" ? badge("OPEN") : `<b class="${cls(b.profit)}">${chf(b.profit || 0)} CHF</b>`;
  return `<div class="card star">
    <div class="meta"><span class="kicker">⭐ Bet of the day</span><span>${dt(b.utc)}</span></div>
    ${legList(b.legs)}${comboLive(b.legs, b.stake, b.odds, b.status === "OPEN")}
    <div class="chips" style="margin-top:12px"><span class="chip tip">Quote <b>@${b.odds.toFixed(2)}</b></span>
      <span class="chip">Modell <b>${pct(b.prob)}</b></span>
      <span class="chip">Einsatz <b>${b.stake.toFixed(0)} CHF</b></span>
      <span style="margin-left:auto">${res}</span></div></div>`;
}

// ---------- Tagesduell: Du gegen den Bot ----------
// Drei Tipps pro Spiel: Sieger (1/X/2) +1, Ueber/Unter 2.5 Tore +1, genaues Resultat +3
const todayLocal = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Europe/Zurich"});
const dgGet = day => { try { return JSON.parse(get("dg:" + day, "null")); } catch (e) { return null; } };
const dgSet = (day, v) => set("dg:" + day, JSON.stringify(v));
const sgn = x => x > 0 ? 1 : x < 0 ? -1 : 0;
const W_OF = (h, a) => h > a ? "1" : h === a ? "X" : "2";
const DG_W = {"1": "Heimsieg", "X": "Unentschieden", "2": "Auswärtssieg"};
const DG_OU = {"O": "Über 2.5", "U": "Unter 2.5"};
function botTip(g) {
  const [h, a] = String(g.bot || "").split(":").map(Number);
  return {w: g.bot_w || (isNaN(h) ? null : W_OF(h, a)), ou: g.bot_ou || (isNaN(h) ? null : h + a > 2.5 ? "O" : "U"), h, a};
}
function dgPts(t, hg, ag) {                 // {w, ou, cs, total} oder null
  if (!t || hg == null || ag == null) return null;
  const w = t.w ? (t.w === W_OF(hg, ag) ? 1 : 0) : null;
  const ou = t.ou ? ((t.ou === "O") === (hg + ag > 2.5) ? 1 : 0) : null;
  const cs = t.h != null && !isNaN(t.h) ? (t.h === hg && t.a === ag ? 3 : 0) : null;
  return {w, ou, cs, total: (w || 0) + (ou || 0) + (cs || 0)};
}
let dgDraft = null, dgEdit = false;
function dgScore() {
  let me = 0, botp = 0;
  (D.daygame || []).forEach(g => { if (g.status !== "done") return;
    botp += dgPts(botTip(g), g.hg, g.ag).total;
    const t = dgGet(g.day); if (t) me += dgPts(t, g.hg, g.ag).total; });
  return {me, botp};
}
function dayGameCard() {
  const day = todayLocal();
  const g = (D.daygame || []).find(x => x.day === day);
  const sc = dgScore();
  const head = `<div class="meta"><span class="kicker">🎮 Tagesduell · Du gegen den Bot</span><span class="dgs">Du <b>${sc.me}</b> : <b>${sc.botp}</b> 🤖</span></div>`;
  const foot = `<button class="link" data-dg="hist" style="margin-top:10px">${state.dgHist ? "Verlauf ausblenden" : "Verlauf anzeigen"}</button>${state.dgHist ? dgHistory() : ""}`;
  if (!g) {
    const msg = new Date().getHours() < 6 ? "Das Spiel des Tages wird um 6 Uhr gewählt." : "Heute gibt es kein passendes Spiel. Morgen geht es weiter!";
    return `<div class="card dg">${head}<div class="empty" style="padding:16px 0 4px">${msg}</div>${foot}</div>`;
  }
  const started = Date.now() >= Date.parse(g.utc);
  const tip = dgGet(day);
  const ev = g.status === "open" && started ? liveOf(g.league, g.utc, g.home, g.away) : null;
  const res = g.status === "done" ? [g.hg, g.ag] : ev ? [ev.hg, ev.ag] : null;
  const teams = `<div class="teams" ${gattr(g.league, g.utc, g.home, g.away)}><span class="t">${crest(g.home, 30)}<span>${esc(g.home)}</span></span>
    ${ev ? bigScore(ev, "dg" + g.day) : res ? `<span class="bigscore end">${res[0]}:${res[1]}</span>` : '<span class="vs">VS</span>'}
    <span class="t"><span>${esc(g.away)}</span>${crest(g.away, 30)}</span></div>
    <div class="probs" style="justify-content:center;gap:10px;align-items:center"><span>${esc(lname(g.league))} · ${dt(g.utc)}</span>${ev ? livePill(ev) : ""}<span class="more" ${gattr(g.league, g.utc, g.home, g.away)}>📊</span></div>`;
  let body;
  if (g.status === "void") body = '<div class="note" style="text-align:center">Das Spiel wurde abgesagt und zählt nicht.</div>';
  else if (!started && (!tip || dgEdit)) {
    dgDraft = dgDraft || (tip ? {w: tip.w || null, ou: tip.ou || null, h: tip.h, a: tip.a} : {w: null, ou: null, h: 1, a: 1});
    const opt = (k, v, lbl) => `<button class="${dgDraft[k] === v ? "on" : ""}" data-dg="${k}=${v}">${lbl}</button>`;
    const step = k => `<div class="stp"><button data-dg="${k}-">−</button><b class="num">${dgDraft[k]}</b><button data-dg="${k}+">+</button></div>`;
    const ready = dgDraft.w && dgDraft.ou;
    body = `<div class="dgq"><div class="dgl">Sieger <small>+1</small></div><div class="seg dgseg">${opt("w", "1", esc(g.home))}${opt("w", "X", "Unentschieden")}${opt("w", "2", esc(g.away))}</div></div>
      <div class="dgq"><div class="dgl">Tore <small>+1</small></div><div class="seg dgseg">${opt("ou", "O", "Über 2.5")}${opt("ou", "U", "Unter 2.5")}</div></div>
      <div class="dgq"><div class="dgl">Genaues Resultat <small>+3</small></div><div class="dgin">${step("h")}<span class="colon">:</span>${step("a")}</div></div>
      <div style="text-align:center"><button class="btn" data-dg="save" ${ready ? "" : "disabled"}>${tip ? "Tipps ändern" : "Tipps abgeben"}</button></div>
      <div class="note" style="text-align:center">${ready ? "" : "Wähle Sieger und Tore. "}🤖 Der Bot hat schon getippt. Seine Tipps werden sichtbar, sobald du getippt hast.</div>`;
  } else {
    const b = botTip(g);
    const pm = tip && res ? dgPts(tip, res[0], res[1]) : null, pb = res ? dgPts(b, res[0], res[1]) : null;
    const pt = (p, k, max) => p == null || p[k] == null ? "" : `<span class="badge ${p[k] ? "won" : "lost"}">+${p[k]}</span>`;
    const cell = (t, k) => t == null || t[k] == null || (k === "h" && isNaN(t.h)) ? "–" : k === "w" ? esc(t.w === "X" ? "X" : t.w === "1" ? g.home : g.away) : k === "ou" ? DG_OU[t.ou] : t.h + ":" + t.a;
    const line = (lbl, k, pk) => `<tr><td>${lbl}</td><td><b>${cell(tip, k)}</b> ${pt(pm, pk)}</td><td><b>${cell(b, k)}</b> ${pt(pb, pk)}</td></tr>`;
    const tot = (p) => p ? `<b class="num">${p.total}</b> ${g.status === "done" ? "Punkte" : "jetzt"}` : "";
    body = `<table class="dgt"><thead><tr><th></th><th>Du</th><th>🤖 Bot</th></tr></thead><tbody>
      ${line("Sieger", "w", "w")}${line("Tore", "ou", "ou")}${line("Resultat", "h", "cs")}
      ${res ? `<tr class="sum"><td>Total</td><td>${tip ? tot(pm) : "–"}</td><td>${tot(pb)}</td></tr>` : ""}</tbody></table>` +
      (!started && tip ? `<div style="text-align:center"><button class="link" data-dg="edit">Tipps ändern (bis Anpfiff)</button></div>` : "") +
      (g.status === "done" ? `<div class="note" style="text-align:center">${dgVerdict(pm && pm.total, pb.total)}</div>` : "");
  }
  return `<div class="card dg">${head}${teams}${body}${foot}</div>`;
}
function dgVerdict(me, b) {
  if (me == null) return "Du hast heute nicht getippt.";
  return me > b ? "🎉 Tagessieg für dich!" : me < b ? "🤖 Der Bot holt sich den Tag." : "🤝 Unentschieden.";
}
function dgHistory() {
  const rows = (D.daygame || []).filter(g => g.day !== todayLocal()).slice().reverse();
  if (!rows.length) return '<div class="note">Noch keine früheren Tage.</div>';
  return `<div class="scroll" style="padding:0;margin-top:8px"><table><thead><tr><th>Tag</th><th>Spiel</th><th>Ende</th><th>Du</th><th>Bot</th></tr></thead><tbody>` +
    rows.map(g => { const t = dgGet(g.day), done = g.status === "done";
      const p = (tp) => !done ? "" : tp ? dgPts(tp, g.hg, g.ag).total : "–";
      return `<tr><td>${g.day.slice(8)}.${g.day.slice(5, 7)}.</td><td>${pair(g.home, g.away, 14)}</td><td>${done ? g.hg + ":" + g.ag : g.status === "void" ? "abgesagt" : "offen"}</td><td><b>${p(t)}</b></td><td><b>${p(botTip(g))}</b></td></tr>`; }).join("") +
    "</tbody></table></div>";
}
function dgClick(act) {
  const day = todayLocal(), g = (D.daygame || []).find(x => x.day === day);
  if (act === "hist") state.dgHist = !state.dgHist;
  else if (act === "edit") { dgEdit = true; dgDraft = null; }
  else if (/^[ha][+-]$/.test(act)) { dgDraft[act[0]] = Math.max(0, Math.min(9, dgDraft[act[0]] + (act[1] === "+" ? 1 : -1))); }
  else if (/^(w|ou)=/.test(act)) { const [k, v] = act.split("="); dgDraft[k] = v; }
  else if (act === "save" && g) {
    if (Date.now() >= Date.parse(g.utc)) alert("Das Spiel hat schon begonnen, Tipps sind gesperrt.");
    else if (dgDraft.w && dgDraft.ou) { dgSet(day, {w: dgDraft.w, ou: dgDraft.ou, h: dgDraft.h, a: dgDraft.a, at: new Date().toISOString(), id: g.id}); dgEdit = false; }
  }
  const y = window.scrollY; $("#view").innerHTML = VIEWS[state.tab](); window.scrollTo(0, y);
  if (act === "save") { const c = document.querySelector(".dg .dgt"); if (c && !REDUCED) c.classList.add("reveal"); }
}

function tips() {
  const all = D.upcoming.filter(inLeague);
  const rows = state.only ? all.filter(r => r.sel.length) : all;
  const nTips = all.filter(r => r.sel.length).length;
  const a = account();
  let h = `<div class="card hero"><div class="lbl">Kontostand</div><div class="big num">${fr(a.bal)} CHF</div>
    <div class="row2"><span>G/V <b class="num">${chf(a.total)}</b></span><span>Offen <b>${a.open.n}</b></span><span>Bot tippt bei <b>${nTips}</b> von ${all.length} Spielen</span></div></div>`;
  h += dayGameCard();
  h += botdCard();
  h += `<div class="seg"><button data-only="0" class="${state.only ? "" : "on"}">Alle Spiele</button><button data-only="1" class="${state.only ? "on" : ""}">Nur Bot-Tipps</button></div>`;
  if (!rows.length) return h + '<div class="card empty">Keine kommenden Spiele gefunden.</div>';
  const T = D.thresholds || {};
  return h + rows.map(r => {
    const o = r.odds || {};
    const q = k => o[k] ? ` <small>@${o[k].toFixed(2)}</small>` : "";
    const sel = r.sel.map(([k, pick, prob, pc, stake]) => `<span class="chip tip">${k === "1X2" ? "Tipp" : k === "SCORE" ? "Resultat" : ""} <b>${esc(pick)}</b> <small>${pct(pc)}</small>${q(k)}<small>· ${stake} CHF</small></span>`).join("");
    const tipBlock = r.sel.length
      ? `<div class="tiprow"><div class="h">🎯 Bot-Tipp</div><div class="chips">${sel}</div></div>`
      : `<div class="skip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>Kein Tipp: zu unsicher</div>`;
    return `<div class="card">
      <div class="meta"><span class="lg"><i class="dot"></i>${esc(lname(r.league))}</span><span>${dt(r.utc)}</span></div>
      <div class="teams" ${gattr(r.league, r.utc, r.home, r.away)}><span class="t">${crest(r.home, 30)}<span>${esc(r.home)}</span></span><span class="vs">VS</span><span class="t"><span>${esc(r.away)}</span>${crest(r.away, 30)}</span></div>
      <div class="bar"><i class="b1" style="flex:${r.p1}"></i><i class="bx" style="flex:${r.px}"></i><i class="b2" style="flex:${r.p2}"></i></div>
      <div class="probs"><span>1 <b>${pct(r.p1)}</b></span><span>X <b>${pct(r.px)}</b></span><span>2 <b>${pct(r.p2)}</b></span></div>
      <div class="chips" style="margin-bottom:10px">
        <span class="chip">Wahrscheinlichstes Resultat <b>${esc(r.score)}</b></span>
        <span class="chip">Ø Tore <b>${(r.eh + r.ea).toFixed(1)}</b></span>
      </div>${tipBlock}</div>`;
  }).join("") + `<div class="note">Der Bot tippt nur, wenn das Modell sicher genug ist: Tipp ab ${pct(T["1X2"])}, Over/Under ab ${pct(T.OU)}, Resultat ab ${pct(T.SCORE)}. Quoten erscheinen, sobald die Fake-Wette platziert ist (bis 3 Tage vor Anpfiff).</div>`;
}

// ---------- Multiplikator ----------
const RUNSTATUS = {ACTIVE: "läuft", REACHED: "Ziel erreicht 🏆", LOST: "verloren", EXPIRED: "Zeit abgelaufen", CANCELLED: "abgebrochen"};
let multiMsg = "";

function multiBetCard(b, i) {
  const open = b.status === "OPEN";
  const res = open || b.status === "CANCELLED" ? badge(b.status) : `<b class="${cls(b.profit)} num">${chf(b.profit || 0)} Fr.</b>`;
  const after = b.pot_after != null ? ` → Topf <b>${fr(b.pot_after)}</b>` : open ? ` → bei Treffer <b>${fr(b.stake * b.odds)}</b>` : "";
  const saved = b.saved ? `<div class="chip" style="margin-top:10px">🏦 <b>${fr(b.saved)} Fr.</b> aufs Sparkonto</div>` : "";
  return `<div class="card${open ? " star" : ""}">
    <div class="bet"><div class="l"><div class="kicker">Stufe ${i + 1}</div><div class="t">Kombi @${b.odds.toFixed(2)} · ${pct(b.prob)}</div>
    <div class="s">Einsatz ${fr(b.stake)} Fr.${after}</div></div><div class="r">${res}</div></div>
    ${legList(b.legs)}${comboLive(b.legs, b.stake, b.odds, open)}${saved}</div>`;
}

function multi() {
  const M = D.multi || {runs: []};
  const runs = M.runs;
  const R = M.rules || {save_every: 3, save_share: 0.5};
  const cur = runs.find(r => r.status === "ACTIVE") || runs[0];
  let h = "";
  if (cur) {
    const total = cur.pot + cur.savings;
    const prog = total > cur.start ? Math.min(1, Math.log(total / cur.start) / Math.log(cur.target / cur.start)) : 0;
    const left = Math.max(0, (new Date(cur.ends_at) - new Date(D.generated)) / 86400000);
    h += `<div class="card hero"><div class="lbl">Versuch #${cur.id} · ${RUNSTATUS[cur.status]}</div>
      <div class="big num">${fr(total)} Fr.</div>
      <div class="row2"><span>Ziel <b class="num">${fr(cur.target)} Fr.</b></span><span>×${(total / cur.start).toFixed(1)} von ×${(cur.target / cur.start).toFixed(0)}</span>
      <span>${cur.status === "ACTIVE" ? "noch <b>" + (left >= 1 ? Math.ceil(left) + " Tage" : Math.round(left * 24) + " Std.") + "</b>" : day(cur.created_at) + " – " + day(cur.ended_at || cur.ends_at)}</span></div>
      <div class="prog"><i style="width:${Math.max(2, prog * 100).toFixed(1)}%"></i></div></div>
      <div class="grid">
      ${m("Topf (wird gesetzt)", fr(cur.pot) + " Fr.")}
      ${m("Sparkonto 🏦", fr(cur.savings) + " Fr.")}
      ${m("Startkapital", fr(cur.start) + " Fr.")}
      ${m("Treffer bis Sparrunde", cur.streak + " / " + R.save_every)}
      ${m("Treffer gesamt", cur.wins)}
      ${cur.status === "ACTIVE" && cur.need != null ? m("Noch nötig", cur.need + " in Folge") : m("Ergebnis", chf(total - cur.start) + " Fr.", cls(total - cur.start))}
      </div>`;
    if (cur.status === "ACTIVE" && cur.need != null)
      h += `<div class="note">Bei rund 45 % Trefferchance pro Kombi liegt die Chance, das Ziel zu erreichen, bei etwa ${cur.chance >= 0.01 ? Math.round(cur.chance * 100) + " %" : "1 zu " + Math.round(1 / cur.chance).toLocaleString("de-CH")}.</div>`;
    if (cur.status === "ACTIVE" && !cur.bets.some(b => b.status === "OPEN"))
      h += '<div class="card empty">Gerade keine Kombi offen. Der Bot sucht stündlich nach Spielen in den nächsten 36 Stunden, die eine Kombi um 2.0 ergeben.</div>';
    const bets = cur.bets.map(multiBetCard).reverse();
    if (bets.length) h += "<h2>Kombis in diesem Versuch</h2>" + bets.join("");
  }
  const d = M.defaults || {start: 100, target: 5000, days: 28};
  h += `<h2>Neuer Versuch</h2><div class="card">
    <div class="form">
      <label>Startkapital<input id="m-start" type="number" inputmode="decimal" min="1" step="any" value="${d.start}"></label>
      <label>Ziel<input id="m-target" type="number" inputmode="decimal" min="1" step="any" value="${d.target}"></label>
      <label>Tage<input id="m-days" type="number" inputmode="numeric" min="1" step="1" value="${d.days}"></label>
    </div>
    <div class="row"><button class="btn" id="m-go">Neuen Versuch starten</button><button class="link" id="m-token">GitHub-Token ändern</button></div>
    <div class="note" id="m-msg">${esc(multiMsg)}</div>
    <div class="note" style="margin-bottom:0">Startet den Bot auf GitHub mit diesen Werten. Ein laufender Versuch wird dabei abgebrochen. Der neue Versuch erscheint nach etwa 2 bis 5 Minuten.
      Alternativ <a href="https://github.com/${esc(D.repo)}/actions/workflows/tippbot.yml" target="_blank" rel="noopener">im Actions-Tab</a> „Run workflow“ wählen.</div></div>`;
  if (runs.length)
    h += `<h2>Alle Versuche</h2><div class="card scroll"><table><thead><tr><th>#</th><th>Start</th><th>Kapital</th><th>Ziel</th><th>Ende</th><th>Status</th></tr></thead><tbody>` +
      runs.map(r => `<tr><td>${r.id}</td><td>${day(r.created_at).slice(0, 6)} · ${r.days} T.</td><td>${fr(r.start)}</td><td>${fr(r.target)}</td><td><b class="${cls(r.pot + r.savings - r.start)}">${fr(r.pot + r.savings)}</b></td><td>${RUNSTATUS[r.status] || r.status}</td></tr>`).join("") +
      "</tbody></table></div>";
  h += `<div class="note">Der Bot setzt jeweils den ganzen Topf auf eine Kombi mit Quote um 2.0 und setzt den Gewinn weiter. Nach je ${R.save_every} Treffern gehen ${Math.round(R.save_share * 100)} % des Gewinns aufs Sparkonto. Eine verlorene Kombi kostet den Topf und beendet den Versuch. Fake-Geld.</div>`;
  return h;
}

function askToken() {
  const t = prompt("Für den Start braucht das Dashboard einmalig ein GitHub-Token (Fine-grained, nur für dieses Repository, Berechtigung „Actions: Read and write“). Es wird nur in diesem Browser gespeichert.", "");
  if (t && t.trim()) { set("gh_token", t.trim()); return t.trim(); }
  return null;
}

async function startMulti() {
  const s = parseFloat($("#m-start").value), t = parseFloat($("#m-target").value), d = parseInt($("#m-days").value, 10);
  const msg = x => { multiMsg = x; const e = $("#m-msg"); if (e) e.textContent = x; };
  if (!(s > 0) || !(t > s) || !(d > 0)) return msg("Bitte gültige Werte eingeben: Ziel muss grösser als das Startkapital sein, Dauer mindestens 1 Tag.");
  const active = (D.multi.runs || []).some(r => r.status === "ACTIVE");
  if (!confirm(`Neuer Versuch: ${fr(s)} Fr. → ${fr(t)} Fr. in ${d} Tagen.` + (active ? "\nDer laufende Versuch wird abgebrochen." : "") + "\nStarten?")) return;
  const tok = get("gh_token", "") || askToken();
  if (!tok) return msg("Ohne GitHub-Token kann das Dashboard den Bot nicht starten.");
  const btn = $("#m-go"); btn.disabled = true; msg("Wird gestartet …");
  try {
    const r = await fetch(`https://api.github.com/repos/${D.repo}/actions/workflows/tippbot.yml/dispatches`, {
      method: "POST",
      headers: {Authorization: "Bearer " + tok, Accept: "application/vnd.github+json"},
      body: JSON.stringify({ref: "main", inputs: {multi_start: String(s), multi_target: String(t), multi_days: String(d)}})});
    if (r.status === 204) msg("Gestartet. Der neue Versuch erscheint in etwa 2 bis 5 Minuten (Seite neu laden).");
    else if (r.status === 401 || r.status === 403 || r.status === 404) { set("gh_token", ""); msg(`GitHub hat den Start abgelehnt (${r.status}). Das Token fehlt, ist abgelaufen oder hat nicht die Berechtigung „Actions: Read and write“ für dieses Repository. Beim nächsten Klick wird es neu abgefragt.`); }
    else msg("Fehler beim Starten: " + r.status + " " + (await r.text()).slice(0, 200));
  } catch (e) { msg("Keine Verbindung zu GitHub: " + e.message); }
  btn.disabled = false;
}

// ---------- Konto ----------
function konto() {
  const days = D.daily.filter(inLeague);
  const open = D.open.filter(inLeague).reduce((a, r) => ({n: a.n + r.n, stake: a.stake + r.stake}), {n: 0, stake: 0});
  const total = days.reduce((a, r) => a + r.profit, 0);
  const staked = days.reduce((a, r) => a + r.staked, 0);
  const hit = k => { const x = days.filter(r => r.kind === k); const n = x.reduce((a, r) => a + r.n, 0); const w = x.reduce((a, r) => a + r.won, 0); return [n, n ? w / n : null]; };
  const [n1, h1] = hit("1X2"), [n2, h2] = hit("SCORE"), [n3, h3] = hit("OU"), [n4, h4] = hit("BOTD");
  const byDay = {};
  days.forEach(r => byDay[r.day] = (byDay[r.day] || 0) + r.profit);
  let bal = D.start_balance; const pts = [["Start", bal]];
  Object.keys(byDay).sort().forEach(d => { bal += byDay[d]; pts.push([d, bal]); });
  return `<div class="card hero"><div class="lbl">Kontostand${state.league !== "ALL" ? " · " + esc(lname(state.league)) : ""}</div>
    <div class="big num">${fr(D.start_balance + total)} CHF</div>
    <div class="row2"><span>G/V <b class="num">${chf(total)}</b></span><span>Rendite <b>${staked ? pct(total / staked) : "–"}</b></span><span>Offen <b>${open.n}</b> (${open.stake.toFixed(0)} CHF)</span></div></div>` +
    chart(pts) + historyView() + `<h2>Trefferquoten</h2><div class="grid">
    ${m(`Tipp 1X2 · ${n1}`, pct(h1))}
    ${m(`Resultat · ${n2}`, pct(h2))}
    ${m(`Over/Under · ${n3}`, pct(h3))}
    ${m(`Bet of the day · ${n4}`, pct(h4))}
  </div>` + selfCheck() + `<div class="note">Fake-Geld. Die Quoten stammen aus dem Modell abzüglich Marge und sagen daher nichts über echte Gewinnchancen gegen Buchmacher aus.</div>`;
}

// ---------- Gewinn-Historie ----------
const longDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("de-CH", {weekday: "short", day: "2-digit", month: "2-digit", year: "2-digit"});
function historyView() {
  const H = (D.history || []).filter(inLeague);
  if (!H.length) return '<h2>Gewinn-Historie</h2><div class="card empty">Die Historie erscheint, sobald die ersten Wetten abgerechnet sind.</div>';
  const all = state.league === "ALL";
  // Tage zusammenfassen (chronologisch), Kontostand nach jedem Tag
  const days = [], idx = {};
  H.forEach(r => { if (!idx[r.day]) { idx[r.day] = {day: r.day, bets: [], profit: 0, won: 0, lost: 0}; days.push(idx[r.day]); }
    const d = idx[r.day]; d.bets.push(r); d.profit += r.profit; if (r.status === "WON") d.won++; else if (r.status === "LOST") d.lost++; });
  let bal = all ? D.history_base : 0;
  days.forEach(d => { bal += d.profit; d.after = bal; });
  // Highlights
  const best = days.reduce((a, d) => d.profit > a.profit ? d : a, days[0]);
  const worst = days.reduce((a, d) => d.profit < a.profit ? d : a, days[0]);
  const top = H.filter(r => r.status === "WON").sort((a, b) => b.profit - a.profit)[0];
  let streak = 0, cur = 0;
  H.forEach(r => { if (r.status === "WON") { cur++; streak = Math.max(streak, cur); } else if (r.status === "LOST") cur = 0; });
  const label = r => r.kind === "BOTD" ? "⭐ Bet of the day" : `${esc(r.home)} – ${esc(r.away)}`;
  let h = `<h2>Gewinn-Historie</h2><div class="grid">
    ${m("Bester Tag · " + longDay(best.day), chf(best.profit) + " CHF", cls(best.profit))}
    ${m("Schlechtester Tag · " + longDay(worst.day), chf(worst.profit) + " CHF", cls(worst.profit))}
    ${top ? m("Grösster Gewinn · " + label(top), chf(top.profit) + " CHF", "pos") : m("Grösster Gewinn", "–")}
    ${m("Längste Treffer-Serie", streak + " in Folge")}
  </div>`;
  const shown = days.slice().reverse().slice(0, state.histAll ? 999 : 10);
  h += shown.map(d => {
    const lines = d.bets.slice().sort((a, b) => b.profit - a.profit).map(r => {
      const what = r.kind === "BOTD" ? `Kombi @${r.odds.toFixed(2)}` : `${KIND[r.kind]} <b>${esc(r.kind === "OU" ? pickLabel(r.pick) : r.pick)}</b> @${r.odds.toFixed(2)}`;
      const res = r.hg != null ? ` · ${r.hg}:${r.ag}` : "";
      return `<div class="bl"><div class="l">${r.kind === "BOTD" ? "⭐ Bet of the day" : pair(r.home, r.away, 16)}<br><small>${what} · Einsatz ${r.stake.toFixed(2)} CHF${res}</small></div>
        <div class="r"><b class="${cls(r.profit)} num">${chf(r.profit)}</b>${badge(r.status)}</div></div>`;
    }).join("");
    return `<details class="card day"><summary><div class="l"><div class="t">${longDay(d.day)}</div>
      <div class="s">${d.bets.length} Wetten · <span class="pos">${d.won} ✓</span> · <span class="neg">${d.lost} ✗</span>${all ? ` · Kontostand danach ${fr(d.after)} CHF` : ""}</div></div>
      <div class="r"><b class="${cls(d.profit)} num">${chf(d.profit)} CHF</b><span class="chev">›</span></div></summary>
      <div class="dl">${lines}</div></details>`;
  }).join("");
  if (days.length > 10 && !state.histAll) h += `<button class="link" id="hist-more" style="margin:2px 4px 8px">Alle ${days.length} Tage anzeigen</button>`;
  return h;
}

function selfCheck() {
  const C = D.calib || {factors: {}, buckets: []};
  const names = {"1X2": "Tipp 1X2", "OU": "Over/Under", "SCORE": "Resultat"};
  let h = '<h2>Selbstkontrolle</h2><div class="note" style="margin-top:0">Trifft der Bot so oft, wie er selbst erwartet? Daraus berechnet er einen Korrekturfaktor, mit dem er Schwellen und Einsätze anpasst. Unter 1.00 heisst: Er war zu optimistisch und wird vorsichtiger.</div><div class="grid">';
  for (const k of ["1X2", "OU", "SCORE"]) {
    const f = C.factors[k] || {n: 0, factor: 1};
    const c = f.factor > 1.005 ? "pos" : f.factor < 0.995 ? "neg" : "";
    h += `<div class="metric"><span>${names[k]} · ${f.n} Wetten</span><b class="${c}">×${f.factor.toFixed(2)}</b>
      <span>${f.n ? `getroffen ${pct(f.rate)} · erwartet ${pct(f.pred)}` : "noch keine Daten"}</span></div>`;
  }
  h += "</div>";
  if (C.buckets.length) {
    h += `<div class="card scroll"><table><thead><tr><th></th><th>Sicherheit</th><th>Wetten</th><th>Erwartet</th><th>Getroffen</th></tr></thead><tbody>` +
      C.buckets.map(b => { const d = b.rate - b.pred; return `<tr><td>${names[b.kind]}</td><td>${Math.round(b.lo * 100)}–${Math.round(b.hi * 100)} %</td><td>${b.n}</td><td>${pct(b.pred)}</td><td><b class="${Math.abs(d) < 0.03 ? "" : d > 0 ? "pos" : "neg"}">${pct(b.rate)}</b></td></tr>`; }).join("") +
      "</tbody></table></div>";
  } else h += '<div class="card empty">Die Auswertung startet automatisch, sobald die ersten Wetten abgerechnet sind.</div>';
  return h;
}

function chart(pts) {
  if (pts.length < 2) return '<div class="card empty">📈 Der Kontoverlauf erscheint nach den ersten abgerechneten Wetten.</div>';
  const W = 600, H = 220, pl = 44, pr = 10, pt = 14, pb = 24;
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => pl + (W - pl - pr) * (i / (pts.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const path = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
  const area = path + ` L${x(pts.length - 1).toFixed(1)} ${H - pb} L${pl} ${H - pb} Z`;
  const base = y(D.start_balance);
  const last = pts[pts.length - 1][1];
  const col = last >= D.start_balance ? "var(--pos)" : "var(--neg)";
  return `<div class="card"><div class="kicker" style="margin-bottom:6px">Kontoverlauf</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kontoverlauf">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" x2="${W - pr}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${pl - 6}" y="${y(hi - pad) + 4}" text-anchor="end">${(hi - pad).toFixed(0)}</text>
    <text x="${pl - 6}" y="${y(lo + pad) + 4}" text-anchor="end">${(lo + pad).toFixed(0)}</text>
    <text x="${pl}" y="${H - 6}">${esc(pts[1][0].slice(5).split("-").reverse().join("."))}</text>
    <text x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(pts[pts.length - 1][0].slice(5).split("-").reverse().join("."))}</text>
    <path d="${area}" fill="url(#ga)"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last)}" r="5" fill="${col}" stroke="var(--card)" stroke-width="2"/>
  </svg></div>`;
}

// ---------- Wetten ----------
function statusSeg(nRun, nOpen) {
  const b = (v, lbl) => `<button data-view="${v}" class="${(state.view || "all") === v ? "on" : ""}">${lbl}</button>`;
  return `<div class="seg">${b("all", "Alle")}${b("live", `🔴 Laufend <small class="cnt">${nRun}</small>`)}${b("open", `Offen <small class="cnt">${nOpen}</small>`)}</div>`;
}

function wetten() {
  const kinds = ["ALL", "1X2", "SCORE", "OU", "BOTD"];
  const seg = '<div class="seg">' + kinds.map(k => `<button data-kind="${k}" class="${state.kind === k ? "on" : ""}">${k === "ALL" ? "Alle" : KIND[k]}</button>`).join("") + "</div>";
  const rows = D.bets.filter(r => inLeague(r) && (state.kind === "ALL" || r.kind === state.kind));
  if (!rows.length) return statusSeg(0, 0) + seg + '<div class="card empty">Noch keine Wetten.</div>';
  const right = r => (r.status === "OPEN" ? "" : `<b class="${cls(r.profit)} num">${chf(r.profit || 0)}</b><br>`) + badge(r.status);
  // Einzelwetten pro Spiel zusammenfassen
  const cards = [], byMatch = {};
  rows.forEach(r => {
    if (r.legs) { cards.push(r); return; }
    const k = r.utc + "|" + r.home + "|" + r.away;
    if (!byMatch[k]) { byMatch[k] = {match: true, league: r.league, utc: r.utc, home: r.home, away: r.away, hg: r.hg, ag: r.ag, bets: []}; cards.push(byMatch[k]); }
    byMatch[k].bets.push(r);
  });
  // Reihenfolge: laufende Spiele zuerst, dann kommende nach Anpfiff, dann abgerechnete (neueste zuerst)
  const isOpen = c => c.match ? c.bets.some(b => b.status === "OPEN") : c.status === "OPEN";
  const isLive = c => isOpen(c) && (c.match ? !!liveOf(c.league, c.utc, c.home, c.away) : c.legs.some(l => l.state === "OPEN" && liveOf(l.league, l.utc, l.home, l.away)));
  // "Laufend": angepfiffen und noch nicht abgerechnet (Live-Stand oder Anpfiff vor weniger als 3 Std.)
  const started = (utc) => { const t = Date.parse(utc); return t <= Date.now() && Date.now() - t < 3 * 3600e3; };
  const running = c => isOpen(c) && (isLive(c) || (c.match ? started(c.utc) : c.legs.some(l => l.state === "OPEN" && started(l.utc))));
  const rank = c => running(c) ? 0 : isOpen(c) ? 1 : 2;
  cards.sort((x, y) => rank(x) - rank(y) || (rank(x) === 1 ? x.utc.localeCompare(y.utc) : y.utc.localeCompare(x.utc)));
  const nRun = cards.filter(running).length, nOpen = cards.filter(isOpen).length;
  const view = state.view === "live" ? cards.filter(running) : state.view === "open" ? cards.filter(isOpen) : cards;
  const segs = statusSeg(nRun, nOpen) + seg;
  // Live-Zusammenfassung
  let nLive = 0, nOk = 0, nBad = 0, pot = 0;
  cards.forEach(c => { if (!c.match) return; const ev = liveOf(c.league, c.utc, c.home, c.away); if (!ev) return;
    c.bets.forEach(b => { if (b.status !== "OPEN") return; nLive++; const ok = liveCheck(b.pick, ev); if (ok) { nOk++; pot += b.stake * (b.odds - 1); } else if (ok === false) nBad++; }); });
  let top = "";
  if (nLive) top = `<div class="card hero"><div class="lbl">🔴 Live</div><div class="big num">${chf(pot)} CHF</div>
    <div class="row2"><span>Gewinn, wenn es so bleibt</span><span><b>${nOk}</b> gehen auf</span><span><b>${nBad}</b> gehen nicht auf</span></div></div>`;
  else if (LIVE.ok === false) top = '<div class="note">Live-Resultate sind gerade nicht erreichbar.</div>';
  if (!view.length) return segs + top + `<div class="card empty">${state.view === "live" ? "⚽ Gerade läuft kein Spiel mit einer offenen Wette." : "Keine offenen Wetten."}</div>`;
  return segs + top + view.map(c => {
    if (!c.match) return `<div class="card star"><div class="bet"><div class="l"><div class="kicker">⭐ Bet of the day</div>
        <div class="t">Kombi @${c.odds.toFixed(2)}</div><div class="s">${dt(c.utc)} · Einsatz ${c.stake.toFixed(2)} CHF</div></div>
        <div class="r">${right(c)}</div></div>${legList(c.legs)}${comboLive(c.legs, c.stake, c.odds, c.status === "OPEN")}</div>`;
    const ev = c.bets.some(b => b.status === "OPEN") ? liveOf(c.league, c.utc, c.home, c.away) : null;
    const lines = c.bets.map(b => {
      let r;
      if (b.status !== "OPEN") r = `<b class="${cls(b.profit)} num">${chf(b.profit || 0)} CHF</b>${badge(b.status)}`;
      else {
        const ok = ev ? liveCheck(b.pick, ev) : null;
        r = (ev ? stateTag(ok, ev.state === "post") : badge("OPEN")) + `<small>bei Treffer <b class="num">+${(b.stake * (b.odds - 1)).toFixed(2)} CHF</b></small>`;
      }
      return `<div class="bl"><div class="l">${KIND[b.kind]} <b>${esc(b.kind === "OU" ? pickLabel(b.pick) : b.pick)}</b><br><small>@${b.odds.toFixed(2)} · Einsatz ${b.stake.toFixed(2)} CHF</small></div><div class="r">${r}</div></div>`;
    }).join("");
    const key = c.utc + c.home;
    const mid = ev ? bigScore(ev, key) : c.hg != null ? `<span class="bigscore end">${c.hg}:${c.ag}</span>` : `<span class="vs">VS</span>`;
    return `<div class="card${ev && ev.state === "in" ? " livecard" : ""}"><div class="meta"><span class="lg"><i class="dot"></i>${esc(lname(c.league))}</span><span>${ev ? livePill(ev) : dt(c.utc)}</span></div>
      <div class="teams" ${gattr(c.league, c.utc, c.home, c.away)}><span class="t">${crest(c.home, 26)}<span>${esc(c.home)}</span></span>${mid}<span class="t"><span>${esc(c.away)}</span>${crest(c.away, 26)}</span></div>
      <div style="text-align:center;margin:-4px 0 6px"><span class="more" ${gattr(c.league, c.utc, c.home, c.away)}>📊 Statistik</span></div>${lines}</div>`;
  }).join("") + `<div class="note">Angezeigt werden die letzten ${D.bets.length} Wetten. Live-Resultate von ESPN, alle 60 Sekunden aktualisiert. „Geht auf“ gilt für den aktuellen Spielstand; verbucht wird die Wette beim nächsten Bot-Lauf.</div>`;
}

function tabelle() {
  const code = oneLeague();
  if ((D.no_table || []).includes(code)) return '<div class="card empty">Für diese Liga gibt es keine Tabelle (die Gruppen sind in den Daten nicht enthalten).</div>';
  const t = D.tables[code] || [];
  if (!t.length) return '<div class="card empty">Noch keine beendeten Spiele für diese Liga.</div>';
  return `<h2>${esc(lname(code))}</h2><div class="card scroll"><table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>TD</th><th>Pkt</th></tr></thead><tbody>` +
    t.map((r, i) => `<tr><td>${i + 1}</td><td><b>${team(r.team, 20)}</b></td><td>${r.sp}</td><td>${r.s}</td><td>${r.u}</td><td>${r.n}</td><td>${r.gf}:${r.ga}</td><td>${r.td > 0 ? "+" : ""}${r.td}</td><td><b>${r.pkt}</b></td></tr>`).join("") + "</tbody></table></div>";
}

function modell() {
  const code = oneLeague();
  const t = D.strength[code] || [];
  if (!t.length) return '<div class="card empty">Noch zu wenig Daten für das Modell.</div>';
  const mx = Math.max(...t.map(r => r.total));
  return `<h2>${esc(lname(code))} · Teamstärken</h2><div class="card scroll"><table><thead><tr><th>#</th><th>Team</th><th>Angriff</th><th>Abwehr</th><th>Gesamt</th></tr></thead><tbody>` +
    t.map((r, i) => `<tr><td>${i + 1}</td><td><b>${team(r.team, 20)}</b><div class="bar" style="height:4px;margin-top:4px;max-width:160px"><i class="b1" style="flex:${r.total / mx}"></i><i style="flex:${1 - r.total / mx}"></i></div></td><td>${r.att.toFixed(2)}</td><td>${r.dfn.toFixed(2)}</td><td><b>${r.total.toFixed(2)}</b></td></tr>`).join("") +
    '</tbody></table></div><div class="note">1.00 = Ligadurchschnitt. Höherer Angriff und niedrigere Abwehr sind besser. Gesamt = Angriff / Abwehr.</div>';
}

// ---------- Tippduell-Challenge ----------
const DUEL_STATUS = {open: "läuft", lost: "verloren", won: "Ziel erreicht 🏆", void: "storniert"};
const DUEL_BADGE = {open: "OPEN", won: "WON", lost: "LOST", void: "VOID"};
const DUEL_ICON = {open: "⏳", won: "✅", lost: "❌", void: "↩️"};

function duelBet(b, i) {
  const res = b.status === "open" ? badge("OPEN") : b.status === "void" ? badge("VOID")
    : `<b class="${b.status === "won" ? "pos" : "neg"} num">${b.status === "won" ? fr(b.payout) + " CHF" : "−" + fr(b.stake)}</b>`;
  const lv = b.legs.map(l => { const ev = l.status === "open" ? liveOf(l.competition, l.kickoff, l.home, l.away) : null; return {ev, ok: ev ? liveCheck(l.pick, ev) : l.status === "lost" ? false : l.status === "open" ? null : true}; });
  const legs = b.legs.map((l, j) => `<div class="leg"><span class="ic">${lv[j].ev ? (lv[j].ok ? "🟢" : "🔴") : DUEL_ICON[l.status]}</span><div>${pair(l.home, l.away, 16)}: <b>${esc(l.label)}</b> ${liveTag(lv[j].ev)}<br><small>${dt(l.kickoff)} · ${esc(l.competition)} · @${l.odds.toFixed(2)}${l.score ? " · Endstand " + esc(l.score) : ""}</small></div></div>`).join("");
  const anyLive = lv.some(x => x.ev);
  const box = b.status !== "open" ? "" : `<div class="livebox">${anyLive ? (lv.some(x => x.ok === false) ? stateTag(false) : lv.every(x => x.ok === true) ? stateTag(true) : '<span class="badge open">⏳ läuft, noch offen</span>') : "<small>Auszahlung bei Treffer</small>"}<b class="num">${fr(b.stake * b.odds)} CHF</b></div>`;
  return `<div class="card${b.status === "open" ? " star" : ""}"><div class="bet"><div class="l"><div class="kicker">Wette ${i + 1} · ${b.legs.length === 1 ? "Einzelwette" : "Kombi"}</div>
    <div class="t">Einsatz ${fr(b.stake)} CHF @${b.odds.toFixed(2)}</div><div class="s">Chance laut Modell ${pct(b.probability)} · gesetzt ${dt(b.placed)}</div></div>
    <div class="r">${res}</div></div><div class="legs">${legs}</div>${box}</div>`;
}

function duell() {
  const C = D.duel || {attempts: [], start: 100, goal: 100000};
  const atts = C.attempts;
  const cur = atts.find(a => a.status === "open") || atts[atts.length - 1];
  let h = "";
  if (cur) {
    const prog = cur.bank > C.start ? Math.min(1, Math.log(cur.bank / C.start) / Math.log(C.goal / C.start)) : 0;
    const best = atts.reduce((m, a) => Math.max(m, a.peak), 0);
    h += `<div class="card hero"><div class="lbl">🥊 Tippduell vs. GoalOracle · Versuch #${cur.n}</div>
      <div class="big num">${fr(cur.bank)} CHF</div>
      <div class="row2"><span>Ziel <b class="num">${fr(C.goal)} CHF</b></span><span>×${(cur.bank / C.start).toFixed(1)} von ×${(C.goal / C.start).toFixed(0)}</span><span>${DUEL_STATUS[cur.status]}</span></div>
      <div class="prog"><i style="width:${Math.max(2, prog * 100).toFixed(1)}%"></i></div></div>
      <div class="grid">
      ${m("Versuche", atts.length)}
      ${m("Höchststand dieser Versuch", fr(cur.peak) + " CHF")}
      ${m("Bester Versuch je", fr(best) + " CHF")}
      </div>`;
    if (!cur.bets.length || cur.bets[cur.bets.length - 1].status !== "open")
      h += '<div class="card empty">Gerade keine Wette offen. Der Bot sucht stündlich nach Spielen in den nächsten 36 Stunden mit einer Gesamtquote von 1.85 bis 2.30.</div>';
    if (cur.bets.length) h += `<h2>Wetten in Versuch #${cur.n}</h2>` + cur.bets.map(duelBet).reverse().join("");
  } else h += '<div class="card empty">Die Challenge startet beim nächsten Bot-Lauf.</div>';
  if (atts.length > 1)
    h += `<h2>Alle Versuche</h2><div class="card scroll"><table><thead><tr><th>#</th><th>Start</th><th>Wetten</th><th>Höchst</th><th>Ende</th><th>Status</th></tr></thead><tbody>` +
      atts.slice().reverse().map(a => `<tr><td>${a.n}</td><td>${day(a.started)}</td><td>${a.bets.length}</td><td>${fr(a.peak)}</td><td><b>${fr(a.bank)}</b></td><td>${DUEL_STATUS[a.status]}</td></tr>`).join("") + "</tbody></table></div>";
  h += `<div class="note">Regeln: Start mit ${fr(C.start)} CHF, immer nur eine offene Wette, der ganze Betrag wird gesetzt. Gesamtquote 1.85 bis 2.30, Einzelwette oder Kombi mit 2–3 Spielen; der Bot nimmt die Variante mit der höchsten Chance laut Modell. Eine verlorene Wette beendet den Versuch, der nächste startet wieder mit ${fr(C.start)} CHF. Quoten aus dem Modell des Bots.</div>`;
  return h;
}

// ---------- Statuszeile «Tippduell» ----------
const DUEL_URLS = {
  own: "https://joellanini26-arch.github.io/tippbot/duel.json",
  cfg: "https://timeo44.github.io/goaloracle/duel-config.json",
  rival: "https://timeo44.github.io/goaloracle/duel.json",
  cmp: "https://timeo44.github.io/goaloracle/vergleich.html"
};
async function loadJson(url) {
  let r;
  try { r = await fetch(url + "?t=" + Date.now(), {cache: "no-store"}); } catch (e) { return {err: "nicht erreichbar"}; }
  if (!r.ok) return {err: "nicht erreichbar"};
  try { return {json: await r.json()}; } catch (e) { return {err: "falsches Format"}; }
}
function checkDuel(res) {
  if (res.err) return {ok: false, why: res.err};
  const j = res.json;
  if (!j || typeof j.format !== "string" || !j.format.startsWith("tippduell/")) return {ok: false, why: "falsches Format"};
  const t = Date.parse(j.updated);
  if (isNaN(t)) return {ok: false, why: "falsches Format"};
  const age = (Date.now() - t) / 3600000;
  return age <= 26 ? {ok: true} : {ok: false, why: "seit " + Math.round(age) + " Std. nicht aktualisiert"};
}
async function duelStatus() {
  const el = $("#duo");
  const item = (name, c) => `<span class="conn ${c ? (c.ok ? "on" : "off") : ""}"><i></i>${name}: ${c ? (c.ok ? "Connected" : "Not connected" + ` <small>(${esc(c.why)})</small>`) : "wird geprüft …"}</span>`;
  const draw = (a, b) => { el.innerHTML = `<b>Tippduell</b>${item("Tippbot", a)}${item("GoalOracle", b)}<a href="${DUEL_URLS.cmp}" target="_blank" rel="noopener">Zum Vergleich →</a>`; };
  draw(null, null);
  const [own, cfg, rival] = await Promise.all([loadJson(DUEL_URLS.own), loadJson(DUEL_URLS.cfg), loadJson(DUEL_URLS.rival)]);
  let mine = checkDuel(own);
  if (mine.ok) {
    if (cfg.err) mine = {ok: false, why: "nicht eingetragen (" + cfg.err + ")"};
    else if (!cfg.json || cfg.json.partner_url !== DUEL_URLS.own) mine = {ok: false, why: "nicht eingetragen"};
  }
  draw(mine, checkDuel(rival));
}

const VIEWS = {tips, duell, multi, konto, wetten, tabelle, modell};
// ---------- Animationen ----------
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastTab = null;
function countUp(el) {                     // Zahl in einer Hero-Karte hochzaehlen
  const m = el.textContent.match(/^([^\d]*?)([+−-]?)([\d'’]+(?:\.\d+)?)(.*)$/);
  if (!m) return;
  const target = parseFloat(m[3].replace(/['’]/g, "")), dec = (m[3].split(".")[1] || "").length;
  if (!(target > 0)) return;
  const fmt = v => v.toLocaleString("de-CH", {minimumFractionDigits: dec, maximumFractionDigits: dec});
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = m[1] + m[2] + fmt(target * e) + m[4];
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function animateView() {
  const v = $("#view");
  if (REDUCED) return;
  v.classList.remove("anim"); void v.offsetWidth; v.classList.add("anim");
  [...v.children].forEach((c, i) => c.style.setProperty("--i", Math.min(i, 12)));
  v.querySelectorAll(".grid").forEach(g => [...g.children].forEach((c, j) => c.style.setProperty("--j", j)));
  v.querySelectorAll(".hero .big").forEach(countUp);
}

function render() {
  $("#tabs").innerHTML = TABS.map(t => `<button data-tab="${t[0]}" class="${state.tab === t[0] ? "on" : ""}${state.tab === t[0] && lastTab !== null && lastTab !== state.tab ? " bounce" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[t[0]]}</svg><span>${t[1]}</span></button>`).join("");
  $("#view").innerHTML = VIEWS[state.tab]();
  $("#lg").style.visibility = state.tab === "multi" || state.tab === "duell" ? "hidden" : "visible";
  if (lastTab !== state.tab) animateView();      // nur beim Oeffnen eines Tabs, nicht bei Live-Updates/Filtern
  lastTab = state.tab;
}
$("#lg").innerHTML = '<option value="ALL">Alle Ligen</option>' + Object.keys(D.leagues).map(c => `<option value="${esc(c)}">${esc(D.leagues[c])}</option>`).join("");
$("#lg").value = state.league;
$("#lg").addEventListener("change", e => { state.league = e.target.value; set("league", state.league); render(); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.tab = b.dataset.tab; history.replaceState(null, "", "#" + state.tab); render(); window.scrollTo(0, 0); });
$("#view").addEventListener("click", e => {
  const gm = e.target.closest("[data-g]");
  if (gm && !e.target.closest("button")) { const [l, u, h, a] = gm.dataset.g.split("|"); openGame(l, u, h, a); return; }
  if (e.target.closest("#m-go")) return startMulti();
  if (e.target.closest("#m-token")) { askToken(); return; }
  const dgb = e.target.closest("[data-dg]");
  if (dgb) { dgClick(dgb.dataset.dg); return; }
  if (e.target.closest("#hist-more")) { state.histAll = true; const y = window.scrollY; $("#view").innerHTML = VIEWS[state.tab](); window.scrollTo(0, y); return; }
  const o = e.target.closest("button[data-only]");
  if (o) { state.only = o.dataset.only === "1"; set("only", state.only ? "1" : "0"); render(); return; }
  const vw = e.target.closest("button[data-view]");
  if (vw) { state.view = vw.dataset.view; set("view", state.view); render(); return; }
  const b = e.target.closest("button[data-kind]"); if (!b) return; state.kind = b.dataset.kind; render(); });
$("#stand").textContent = "Stand " + new Date(D.generated).toLocaleString("de-CH", {timeZone: "Europe/Zurich", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) + " · Fake-Geld";
render();
refreshLive();
setInterval(refreshLive, 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (!LIVE.at || Date.now() - LIVE.at > 30e3)) refreshLive(); });
duelStatus();
setInterval(duelStatus, 5 * 60 * 1000);
setTimeout(() => location.reload(), 10 * 60 * 1000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => {   // App wieder geoeffnet: neuen Stand laden, falls aelter als 10 Min.
  if (document.visibilityState === "visible" && Date.now() - new Date(D.generated) > 15 * 60 * 1000 && Date.now() - LOADED > 60 * 1000) location.reload();
});
</script>
</body>
